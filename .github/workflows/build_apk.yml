name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'  # 推送 v1.0.0 等 tag 时触发
  workflow_dispatch:  # 也支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle (optional)
        run: flutter build appbundle --release

      - name: Get version from pubspec
        id: version
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: //')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: 花笺 v${{ steps.version.outputs.version }}
          body: |
            ## 花笺 Android APK

            - 备孕工作台（任务/周期/财务/营养）
            - 备婚预算（分类/流水/图表/倒计时）
            - 事项管理（模块/任务/日历/统计）
            - 工作台聚合日历

            安装方式：下载对应架构的 APK 后侧载安装。
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK artifacts (manual trigger)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: hua-todo-apk
          path: |
            build/app/outputs/flutter-apk/*.apk