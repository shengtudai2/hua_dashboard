name: hua_todo_apk
description: "花笺 — 个人事务管理平台（备孕·备婚·事项）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.3.5
  fl_chart: ^0.70.2
  table_calendar: ^3.1.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: ZCOOL KuaiLe
      fonts:
        - asset: assets/fonts/ZCOOLKuaiLe-Regular.ttf
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
          weight: 500
        - asset: assets/fonts/Baloo2.ttf
          weight: 700
        - asset: assets/fonts/Baloo2.ttf
          weight: 800
    - family: Noto Serif SC
      fonts:
        - asset: assets/fonts/NotoSerifSC.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifSC.ttf
          weight: 700